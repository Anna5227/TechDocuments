<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PluseVibe - Регистрация</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-gamepad"></i>
                <span>PluseVibe</span>
            </div>
            <ul class="nav-links">
                <li><a href="./home.html"><i class="fas fa-home"></i> Главная</a></li>
                <li><a href="./catalog.html"><i class="fas fa-store"></i> Каталог</a></li>
                <li><a href="./about.html"><i class="fas fa-info-circle"></i> О проекте</a></li>
                <li><a href="./registration.html" class="active"><i class="fas fa-user"></i> Регистрация</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="registration-page">
        <div class="forms-container">
            <div class="registration-form-container">
                <h2><i class="fas fa-user-plus"></i> Регистрация</h2>
                <form id="registrationForm">
                    <div class="form-group">
                        <label for="regName">Имя пользователя</label>
                        <input type="text" id="regName" placeholder="Введите имя пользователя">
                        <span class="error-message" id="regNameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" placeholder="Введите email">
                        <span class="error-message" id="regEmailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Пароль</label>
                        <input type="password" id="regPassword" placeholder="Введите пароль (мин. 6 символов)">
                        <span class="error-message" id="regPasswordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword">Подтвердите пароль</label>
                        <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль">
                        <span class="error-message" id="regConfirmError"></span>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="regAgree">
                            Я согласен с условиями использования
                        </label>
                        <span class="error-message" id="regAgreeError"></span>
                    </div>
                    <button type="submit" class="btn-submit">Зарегистрироваться</button>
                    <div id="regSuccess" class="success-message" style="display: none;">
                        <i class="fas fa-check-circle"></i> Регистрация успешна!
                    </div>
                </form>
            </div>

            <div class="feedback-form-container">
                <h2><i class="fas fa-envelope"></i> Обратная связь</h2>
                <form id="feedbackForm">
                    <div class="form-group">
                        <label for="feedbackName">Ваше имя</label>
                        <input type="text" id="feedbackName" placeholder="Введите ваше имя">
                        <span class="error-message" id="feedbackNameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="feedbackEmail">Email</label>
                        <input type="email" id="feedbackEmail" placeholder="Введите ваш email">
                        <span class="error-message" id="feedbackEmailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="feedbackSubject">Тема</label>
                        <select id="feedbackSubject">
                            <option value="">Выберите тему</option>
                            <option value="question">Вопрос</option>
                            <option value="suggestion">Предложение</option>
                            <option value="problem">Проблема</option>
                            <option value="other">Другое</option>
                        </select>
                        <span class="error-message" id="feedbackSubjectError"></span>
                    </div>
                    <div class="form-group">
                        <label for="feedbackMessage">Сообщение</label>
                        <textarea id="feedbackMessage" rows="4" placeholder="Опишите ваше сообщение..."></textarea>
                        <span class="error-message" id="feedbackMessageError"></span>
                    </div>
                    <button type="submit" class="btn-submit">Отправить</button>
                    <div id="feedbackSuccess" class="success-message" style="display: none;">
                        <i class="fas fa-check-circle"></i> Сообщение отправлено!
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>PluseVibe</h4>
                <p>Лучшие игры для настоящих геймеров</p>
            </div>
            <div class="footer-section">
                <h4>Контакты</h4>
                <p><i class="fas fa-envelope"></i> support@plusevibe.com</p>
                <p><i class="fas fa-phone"></i> +7 (999) 123-45-67</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>2026 PluseVibe. Все права защищены.</p>
        </div>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
